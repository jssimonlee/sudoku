<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Sudoku</title>
    <!-- Add inline SVG favicon to prevent 404 errors -->
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧩</text></svg>">
    <!-- Premium Google Fonts: Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <header>
            <div class="header-top">
                <h1>Sudoku</h1>
                <div class="header-actions">
                    <!-- Effect settings (richer game effects ON/OFF, sound, vibration) -->
                    <button id="fx-toggle" class="icon-btn" aria-label="효과 설정" title="효과 설정">
                        <i class="fas fa-magic"></i>
                    </button>
                    <!-- Combo mode (order-based scoring mini game) -->
                    <button id="combo-toggle" class="icon-btn" aria-label="Toggle Combo Mode" aria-pressed="false"
                        title="콤보 모드: 입력 순서로 족보를 만들어 점수 얻기">
                        <i class="fas fa-dice"></i>
                    </button>
                    <!-- TOP 10 leaderboard (shown only when a server is configured) -->
                    <button id="lb-toggle" class="icon-btn" aria-label="TOP 10 순위표" title="TOP 10 순위표" hidden>
                        <i class="fas fa-trophy"></i>
                    </button>
                    <!-- Pause button moved here as small icon -->
                    <button id="btn-pause" class="icon-btn" aria-label="Pause Game" title="게임 일시정지 / 재개">
                        <i class="fas fa-pause" id="pause-icon"></i>
                    </button>
                </div>
            </div>

            <div class="stats-bar">
                <div class="difficulty-selector">
                    <select id="difficulty" aria-label="Select Difficulty" title="난이도 선택">
                        <option value="easy">Easy</option>
                        <option value="medium" selected>Medium</option>
                        <option value="hard">Hard</option>
                        <option value="expert">Expert</option>
                        <option value="daily">📅 Daily</option>
                    </select>
                </div>
                <div class="timer" id="timer">00:00</div>
                <div class="mistakes-container" title="남은 기회">
                    <div class="health-bars" id="health-bars">
                        <div class="health-bar active"></div>
                        <div class="health-bar active"></div>
                        <div class="health-bar active"></div>
                    </div>
                </div>
            </div>
        </header>

        <main>
            <div class="board-container">
                <div class="sudoku-board" id="sudoku-board">
                    <!-- JS injects 81 cells here -->
                </div>

                <!-- Game Over / Win Overlay -->
                <div class="overlay" id="game-overlay">
                    <div class="overlay-content" id="game-overlay-content">
                        <span class="overlay-kicker" id="overlay-kicker">게임 결과</span>
                        <h2 id="overlay-title">도전 종료</h2>
                        <p id="overlay-msg">실수 3회를 모두 사용했습니다.</p>
                        <!-- Win only: this game's numbers and personal bests -->
                        <div class="result-stats" id="overlay-stats"></div>
                        <button id="overlay-btn" class="primary-btn">새 게임 시작</button>
                    </div>
                </div>

                <!-- Pause Overlay -->
                <div class="overlay pause-overlay" id="pause-overlay">
                    <div class="pause-play-btn" id="pause-resume-btn" aria-label="Resume Game">
                        <i class="fas fa-play"></i>
                    </div>
                </div>
            </div>

            <!-- Combo Mode Panel -->
            <section class="combo-panel" id="combo-panel" aria-live="polite" hidden>
                <div class="combo-row">
                    <div class="combo-score-box">
                        <span class="combo-label">점수</span>
                        <span class="combo-score" id="combo-score">0</span>
                        <span class="combo-heat" id="combo-heat" hidden>
                            <i class="fas fa-fire"></i><span id="combo-heat-count">0</span>
                        </span>
                    </div>
                    <div class="combo-slots" id="combo-slots" aria-label="현재 패"></div>
                    <span class="combo-current" id="combo-current"></span>
                    <button class="combo-help-btn" id="combo-help-btn" type="button" title="족보표 보기">
                        <i class="fas fa-list-ol"></i><span>족보</span>
                    </button>
                    <button class="combo-sound-btn" id="combo-sound-btn" type="button" aria-label="소리 켜기/끄기"
                        aria-pressed="true" title="소리 끄기">
                        <i class="fas fa-volume-up"></i>
                    </button>
                    <div class="combo-flash" id="combo-flash"></div>
                </div>
                <div class="combo-row">
                    <span class="combo-label">다음 예상</span>
                    <div class="combo-predictions" id="combo-predictions"></div>
                </div>
            </section>

            <!-- Combo Paytable Popup -->
            <div class="combo-modal" id="combo-modal" role="dialog" aria-modal="true" aria-labelledby="combo-modal-title" hidden>
                <div class="combo-modal-content">
                    <div class="combo-modal-header">
                        <h3 id="combo-modal-title">콤보 족보표</h3>
                        <button class="combo-modal-close" id="combo-modal-close" type="button" aria-label="닫기">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    <ul class="combo-rules">
                        <li>정답을 넣는 <b>순서</b>대로 패가 쌓입니다 (최대 5장).</li>
                        <li>최고 족보나 5장이 되면 <b>바로 확정</b>되고 새 패가 시작됩니다.</li>
                        <li>흐름이 끊기는 번호를 넣으면 지금까지의 패를 확정하고, 그 번호로 새 패를 시작합니다.</li>
                        <li>실수하면 <b>확정 전 패는 날아갑니다</b>.</li>
                    </ul>
                    <div class="combo-paytable" id="combo-paytable"></div>

                    <button class="fx-open-btn" id="combo-open-fx" type="button">
                        <i class="fas fa-magic"></i><span>효과·소리 설정</span>
                    </button>
                </div>
            </div>

            <!-- Effect Settings Popup -->
            <div class="combo-modal" id="fx-modal" role="dialog" aria-modal="true" aria-labelledby="fx-modal-title" hidden>
                <div class="combo-modal-content">
                    <div class="combo-modal-header">
                        <h3 id="fx-modal-title">효과 설정</h3>
                        <button class="combo-modal-close" id="fx-modal-close" type="button" aria-label="닫기">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    <div class="fx-settings">
                        <label class="fx-setting">
                            <span><b>화려한 게임 효과</b><small>정답 반짝임, 줄·박스 완성 물결, 숫자 완성, 생명력 감소, 클리어 컨페티. 끄면 기본 효과만</small></span>
                            <input type="checkbox" id="fx-setting-board" checked>
                            <span class="fx-switch" aria-hidden="true"></span>
                        </label>
                        <label class="fx-setting">
                            <span><b>콤보 효과</b><small>콤보 모드의 족보 확정 연출 (칸 빛남, 배너, 흔들림)</small></span>
                            <input type="checkbox" id="fx-setting-effects" checked>
                            <span class="fx-switch" aria-hidden="true"></span>
                        </label>
                        <label class="fx-setting">
                            <span><b>소리</b><small>위 효과가 켜져 있을 때 나는 효과음</small></span>
                            <input type="checkbox" id="fx-setting-sound" checked>
                            <span class="fx-switch" aria-hidden="true"></span>
                        </label>
                        <label class="fx-setting">
                            <span><b>진동</b><small>완성·실수 시 (모바일)</small></span>
                            <input type="checkbox" id="fx-setting-vibrate" checked>
                            <span class="fx-switch" aria-hidden="true"></span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- TOP 10 Leaderboard Popup -->
            <div class="combo-modal" id="lb-modal" role="dialog" aria-modal="true" aria-labelledby="lb-modal-title" hidden>
                <div class="combo-modal-content lb-modal-content">
                    <div class="combo-modal-header">
                        <h3 id="lb-modal-title"><i class="fas fa-trophy"></i> TOP 10</h3>
                        <button class="combo-modal-close" id="lb-modal-close" type="button" aria-label="닫기">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>

                    <form class="lb-submit" id="lb-submit" hidden>
                        <p class="lb-submit-title">TOP 10 진입!</p>
                        <ul class="lb-qualify" id="lb-qualify"></ul>
                        <label class="lb-initials-label" for="lb-initials">이니셜 (영문·숫자 3글자)</label>
                        <input id="lb-initials" class="lb-initials" maxlength="3" autocomplete="off"
                            autocapitalize="characters" spellcheck="false" inputmode="text">
                        <div class="lb-turnstile" id="lb-turnstile" hidden></div>
                        <p class="lb-message" id="lb-submit-msg" role="status"></p>
                        <div class="lb-actions">
                            <button type="button" class="lb-btn" id="lb-skip">건너뛰기</button>
                            <button type="submit" class="lb-btn lb-btn-primary" id="lb-send">등록</button>
                        </div>
                    </form>

                    <p class="lb-result" id="lb-result" role="status" hidden></p>
                    <!-- One dropdown for all 12 boards; opens on the current game's mode and level -->
                    <div class="lb-picker-row">
                        <div class="lb-picker">
                            <select id="lb-board" aria-label="순위표 선택"></select>
                            <i class="fas fa-chevron-down" aria-hidden="true"></i>
                        </div>
                        <!-- Combo boards only: flip between the time and score rankings -->
                        <button type="button" class="lb-switch" id="lb-switch" hidden>
                            <i class="fas fa-star" aria-hidden="true"></i>
                            <span id="lb-switch-label">점수 보기</span>
                        </button>
                    </div>
                    <div class="lb-head" aria-hidden="true">
                        <span>순위</span><span>이름</span><span id="lb-head-main">기록</span>
                    </div>
                    <ol class="lb-table" id="lb-table"></ol>
                    <p class="lb-status" id="lb-status" hidden></p>
                </div>
            </div>

            <div class="controls-panel">
                <div class="numpad" id="numpad">
                    <!-- 1 to 9 Numpad Buttons -->
                    <button class="num-btn" data-val="1">1</button>
                    <button class="num-btn" data-val="2">2</button>
                    <button class="num-btn" data-val="3">3</button>
                    <button class="num-btn" data-val="4">4</button>
                    <button class="num-btn" data-val="5">5</button>
                    <button class="num-btn" data-val="6">6</button>
                    <button class="num-btn" data-val="7">7</button>
                    <button class="num-btn" data-val="8">8</button>
                    <button class="num-btn" data-val="9">9</button>
                </div>

                <div class="action-buttons">
                    <button class="action-btn" id="btn-undo" title="실행 취소 (Ctrl+Z)"><i
                            class="fas fa-undo"></i><span>Undo</span></button>
                    <button class="action-btn" id="btn-erase" title="선택 칸 지우기 (Backspace)"><i
                            class="fas fa-eraser"></i><span>Erase</span></button>
                    <button class="action-btn" id="btn-notes" title="메모 모드: 예상 숫자를 작게 적기"><i
                            class="fas fa-pencil-alt"></i><span>Notes</span></button>
                    <button class="action-btn new-game-btn" id="btn-new-game" title="새 게임 시작"><i
                            class="fas fa-plus"></i><span>New</span></button>
                </div>
            </div>
        </main>
    </div>
    <script src="stats.js"></script>
    <script src="effects.js"></script>
    <script src="combo.js"></script>
    <script src="leaderboard-config.js"></script>
    <script src="leaderboard.js"></script>
    <script src="script.js"></script>
</body>

</html>
